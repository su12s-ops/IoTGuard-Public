name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check published Markdown links
        run: python scripts/check_docs.py

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Create isolated test environment
        # Hosted runners contain unrelated tools (for example pipx) whose
        # dependencies must not contaminate application compatibility checks.
        run: |
          python -m venv .venv
          python -c "import os,pathlib; p=pathlib.Path('.venv')/('Scripts' if os.name=='nt' else 'bin'); f=open(os.environ['GITHUB_PATH'],'a'); f.write(str(p.resolve())+'\n'); f.close()"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run regression suite
        # conftest permits loopback test doubles and temporary databases only.
        run: python -m pytest -q --tb=short

  frontend:
    # GitHub-hosted Windows images include Microsoft Edge. Keep browser
    # validation aligned with the supported local browser and avoid installing
    # a separate Chromium binary.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Frontend state and contract tests
        run: node --test tests/*.test.js
      - name: Isolated browser regression
        env:
          PLAYWRIGHT_CHANNEL: msedge
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: frontend/test-results
          retention-days: 7
