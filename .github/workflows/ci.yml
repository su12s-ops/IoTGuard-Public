name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Run regression suite
        # 常规回归口径：4 个真实套接字测试文件需独立 profile（本仓 conftest 审计钩子
        # 禁止真实网络），与交付回归一致地显式排除，详见 ai_collaboration/TEST_RESULTS.md
        run: >
          python -m pytest -q --tb=short
          --ignore=tests/test_iot_device_upgrade.py
          --ignore=tests/test_scan_runs.py
          --ignore=tests/test_scan_targets.py
          --ignore=tests/test_mqtt_remediation_workflow.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
