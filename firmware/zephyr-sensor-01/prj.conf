# Zephyr-Sensor-01 — qemu_cortex_a9 配置（Zephyr v4.4.2）
# 网络：IPv4 + TCP sockets + DHCP（QEMU SLIRP 提供 10.0.2.15）
# NET_QEMU_ETHERNET：QEMU 目标板上 eth_xlnx_gem(GEM) 驱动的启用条件
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_QEMU_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_APP_FW_VERSION="0.3.0-iotguard"
CONFIG_APP_QEMU_HOST_ENTROPY=y
CONFIG_TEST_RANDOM_GENERATOR=n
CONFIG_TEST_CSPRNG_GENERATOR=n
CONFIG_HARDWARE_DEVICE_CS_GENERATOR=y
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=64

# 缓冲池（参考 samples/net/sockets 保守配置）
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_NET_BUF_DATA_SIZE=512

# 线程与堆
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_INIT_STACKS=y
CONFIG_THREAD_NAME=y

# 日志：串口控制台（QEMU -nographic 映射到 stdio）
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# 无 SSH/包管理/eBPF —— RTOS 上均不存在（由 IoTGuard 侧标记 unsupported）
