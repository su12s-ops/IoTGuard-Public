# LinuxGuard frontend production server.
# - SPA history-mode fallback: every unknown path serves index.html (route
#   refresh works); hashed /static assets are immutable-cacheable.
# - /api reverse proxy: browser uses one origin; the API base is NOT a
#   cross-origin URL baked at build time. No dev-server features exposed
#   (no HMR, no vite debug endpoints).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the shell; hashed build assets are immutable.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # Only scripted console requests get server-side authorization.
        # Cross-site forms cannot set this header; backend approval gates remain.
        set $console_token $http_x_control_token;
        if ($http_x_console_request = "1") {
            set $console_token "${LINUXGUARD_CONTROL_TOKEN}";
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # Keep the browser-facing port for backend same-origin checks.
        proxy_set_header Host $http_host;
        proxy_set_header X-Control-Token $console_token;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # long-running analysis/collection requests
        proxy_send_timeout 300s;
        client_max_body_size 20m;  # inventory upload upper bound
    }

    # Minimal response headers; no server token disclosure.
    server_tokens off;
}
