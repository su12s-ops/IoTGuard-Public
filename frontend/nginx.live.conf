# LinuxGuard frontend production server.
# - SPA history-mode fallback: every unknown path serves index.html (route
#   refresh works); hashed assets are immutable-cacheable.
# - /api reverse proxy: browser uses one origin; the API base is NOT a
#   cross-origin URL baked at build time. No dev-server features exposed
#   (no HMR, no vite debug endpoints).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the shell; hashed build assets are immutable.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # long-running analysis/collection requests
        proxy_send_timeout 300s;
        client_max_body_size 20m;  # inventory upload upper bound
    }

    # Minimal response headers; no server token disclosure.
    server_tokens off;
}
