<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Signal Desk · contact sheet</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { width: 2400px; height: 1840px; overflow: hidden; }
  body { font-family: var(--font-body); }
  .sheet { height: 100%; padding: 34px 40px 22px; display: flex; flex-direction: column; }
  .sheet-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .sheet-kicker { color: var(--accent); font: 700 10px var(--font-num); letter-spacing: .18em; text-transform: uppercase; }
  .sheet-head h1 { margin: 8px 0 6px; color: var(--ink); font-family: var(--font-display); font-size: 54px; line-height: .95; letter-spacing: -.045em; font-weight: 700; }
  .sheet-desc { margin: 0; max-width: 760px; color: var(--ink-3); font-size: 14px; line-height: 1.6; }
  .sheet-meta { text-align: right; color: var(--muted); font: 10px var(--font-num); letter-spacing: .04em; line-height: 1.8; white-space: nowrap; }
  .sheet-meta b { display: block; color: var(--ink); font: 700 13px var(--font-num); letter-spacing: .02em; }
  .swatches { display: flex; gap: 6px; justify-content: flex-end; margin-top: 12px; }
  .swatches i { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  body[data-theme="editorial"] .swatches i { border-radius: 0; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 17px 18px; margin-top: 20px; }
  figure { margin: 0; min-width: 0; }
  figure img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
  body[data-theme="editorial"] figure img { border-color: #181410; border-radius: 0; }
  body[data-theme="nocturne"] figure img { border-color: var(--line); }
  figcaption { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-top: 7px; color: var(--ink-2); font-size: 11.5px; font-weight: 600; }
  figcaption b { margin-right: 5px; color: var(--muted); font: 700 8.5px var(--font-num); letter-spacing: .08em; }
  figcaption .file { color: var(--muted); font: 8.5px var(--font-num); font-weight: 400; }
  .sheet-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font: 9px var(--font-num); letter-spacing: .04em; }
</style>
</head>
<body data-theme="prism">
<div class="sheet">
  <header class="sheet-head">
    <div>
      <div class="sheet-kicker">Signal Desk / 03 directions</div>
      <h1 id="themeName">PRISM</h1>
      <p class="sheet-desc" id="themeDesc"></p>
    </div>
    <div class="sheet-meta">
      <b>9 / 9 modules</b>
      desktop 1440 × 960<br>
      rendered at 2×
      <div class="swatches" id="swatches"></div>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <footer class="sheet-foot">
    <span>IoTGuard · desktop concept v2 · 2026-10-21</span>
    <span id="footTheme">PRISM</span>
  </footer>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const theme = params.get("theme") || "prism";
  const meta = {
    prism: {
      name: "PRISM",
      desc: "冷调渐变、大圆角、玻璃卡片与彩色图表。更接近现代 SaaS，适合作为主产品的视觉方向。",
      colors: ["#00a88f", "#3b6cff", "#8b5cf6", "#f5a524", "#e0483c"]
    },
    editorial: {
      name: "EDITORIAL",
      desc: "奶油底、黑边框、衬线数字与朱红强调。更像一本可交付的安全报告，适合品牌、报告与归档。",
      colors: ["#d9482b", "#0e6b5c", "#b07a1d", "#181410", "#f5eee2"]
    },
    nocturne: {
      name: "NOCTURNE",
      desc: "深色底、青色霓虹、网格与等宽标签。更像控制室，适合 SOC 大屏与长时间值守。",
      colors: ["#22d3ee", "#a3e635", "#a78bfa", "#fbbf24", "#fb7185"]
    }
  }[theme];

  document.body.dataset.theme = theme;
  document.getElementById("themeName").textContent = meta.name;
  document.getElementById("themeDesc").textContent = meta.desc;
  document.getElementById("footTheme").textContent = meta.name + " / IoTGuard";
  document.getElementById("swatches").innerHTML = meta.colors.map((c) => `<i style="background:${c}"></i>`).join("");

  const modules = [
    ["overview", "安全态势"],
    ["assets", "资产与发现"],
    ["risks", "漏洞与风险"],
    ["risk-detail", "风险详情 / 裁决"],
    ["agents", "智能研判"],
    ["repairs", "修复与验证"],
    ["runtime", "运行与审计"],
    ["reports", "报告与归档"],
    ["soc", "SOC 态势大屏"]
  ];

  document.getElementById("grid").innerHTML = modules.map(([file, label], i) => `
    <figure>
      <img src="shots/${theme}-${file}.png" alt="${label}">
      <figcaption><span><b>0${i + 1}</b>${label}</span><span class="file">${file}.png</span></figcaption>
    </figure>`).join("");

  document.title = "Signal Desk · " + meta.name;
</script>
</body>
</html>
